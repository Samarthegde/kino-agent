[package]
name = "kino-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls (not native-tls) so the binary has no OpenSSL system dependency and stays
# portable across distros; native-roots means it honours the OS trust store, so
# internal/corporate CAs work as well as public ones.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# rustls 0.23 refuses to pick a crypto backend for you - without this (and the
# install_default() call in main) the first wss:// connect panics at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lets the binary run as a real Windows service (SCM status + stop handling)
# rather than needing an external wrapper like NSSM.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: kino-agent-x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: kino-agent-aarch64-unknown-linux-gnu
            # Cross-compiled from the x86_64 runner - ring needs the matching C
            # compiler, so point both cargo's linker and ring's CC at it.
            cross_gcc: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: kino-agent-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.cross_gcc != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_gcc }}

      - name: Set cross env
        if: matrix.linker != ''
        shell: bash
        run: |
          TU=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${TU}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_${{ matrix.target }}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # win_service.rs is behind cfg(windows) and never type-checked on Linux,
      # so this matrix is what actually keeps it honest. -D warnings matches
      # the gate a contributor sees locally.
      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Normalize the per-target binary name to the asset name the bootstrap
      # installers expect to download.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/kino-agent.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/kino-agent" "dist/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # On a version tag, gather the binaries and publish a GitHub Release. The
  # bootstrap installers download from these assets.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
